{% extends 'base.html' %}

{% block title %}
Программирование автоключей
{% endblock %}

{% block body %}
<div class="container mt-4">
    <h1 class="mb-4">Программирование автоключей</h1>
    <select class="form-select form-select-lg mb-3" id="select_brand">
        <option selected>Все модели</option>
        {% for el in carkey_models_uniq %}
            <option value="{{ el.cat }}">{{ el.cat }}</option>
        {% endfor %}
    </select>
    <div class="row g-2 row-cols-1 row-cols-md-2 row-cols-lg-3" id="cont_carkey">
        {% for el in carkey_models %}
            <div class="col col_my">
                <div class="card card_my h-100">
                    <div class="card_div_img carkey"><img src="/static/article/carkey/{{ el.cat }}/{{ el.subcat }}/{{ el.header }}/{{ el.cat }}_{{ el.subcat }}_{{ el.header }}.jpg" alt=""></div>
                    <div class="card-body">
                        <h3 class="card-title">{{ el.cat }} {{ el.subcat }} ({{ el.header }})</h3>
                        <div class="div_card_btn"><a href="/carkey/{{ el.cat }}/{{ el.subcat }}/{{ el.header }}" class="btn btn-primary btn-lg card_my_btn stretched-link">Смотреть</a></div>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}

{% block script %}
    <script>
        $(document).ready(function () {
            $("#select_brand").change(function () {
                let brand = $(this).val();
                if (brand != '') {
                    $.ajax({
                        url: "{{url_for('getCarkeyAjax')}}",
                        type: "POST",
                        data: {"data":brand},
                        success: function (res) {
                            $("#cont_carkey").empty();
                            $("#cont_carkey").append(res).hide().fadeIn(1000);
                            baguetteBox.run('.gallery', {}); {#Инициализация скрипта галереи для добавленных изображений#}
                        }
                    });
                } else {
                    $("#cont_carkey").html("😑");
                }
            });
        });
    </script>
{% endblock %}
